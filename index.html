<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <meta name="description" content="Gallery — an online art gallery">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #FAF7F2;
      color: #2C2C2C;
      font-family: 'Playfair Display', 'Noto Serif KR', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────── */
    .gallery-header {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }

    .gallery-header h1 {
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #2C2C2C;
    }

    .gallery-header .subtitle {
      margin-top: 0.5rem;
      font-size: 1.15rem;
      font-style: italic;
      color: #B8977E;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: #B8977E;
      margin: 1.5rem auto 0;
    }

    /* ── Masonry grid ───────────────────────── */
    .masonry {
      column-count: 4;
      column-gap: 1.5rem;
      padding: 2rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
      flex: 1;
    }

    .masonry figure {
      break-inside: avoid;
      margin: 0 0 1.5rem;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .masonry figure:hover {
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
      transform: translateY(-3px);
    }

    .masonry figure img {
      display: block;
      width: 100%;
      height: auto;
    }

    .masonry figcaption {
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: #2C2C2C;
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* ── Footer ─────────────────────────────── */
    .gallery-footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.85rem;
      color: #B8977E;
      letter-spacing: 0.04em;
    }

    /* ── Responsive breakpoints ──────────────── */
    @media (max-width: 1200px) {
      .masonry {
        column-count: 3;
      }
    }

    @media (max-width: 1024px) {
      .masonry {
        column-count: 2;
        padding: 1.5rem 2rem;
      }
    }

    @media (max-width: 600px) {
      .masonry {
        column-count: 1;
        padding: 1rem;
      }

      .gallery-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
